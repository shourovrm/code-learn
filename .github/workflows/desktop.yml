name: Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The app bundles the core from this repository (DESIGN §7).
      - name: Install the core's dependencies
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # No secrets reach PR builds, so they never get a real signature. electron-builder
      # skips all signing on PRs unless told otherwise; allow it so macOS is signed ad hoc.
      - run: npm run dist
        env:
          CSC_FOR_PULL_REQUEST: "true"
      # D1: the packaged app with no Node or npm on PATH.
      - name: Packaged smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            app="$(ls -d release/mac-arm64/code-learn.app release/mac/code-learn.app 2>/dev/null | head -1)"
            export CODE_LEARN_PACKAGED="$PWD/$app/Contents/MacOS/code-learn" CODE_LEARN_RESOURCES="$PWD/$app/Contents/Resources"
          else
            export CODE_LEARN_PACKAGED="$PWD/release/win-unpacked/code-learn.exe" CODE_LEARN_RESOURCES="$PWD/release/win-unpacked/resources"
          fi
          npm run test:packaged
      # Each Mac app carries its own chip's wasmtime (scripts/fetch-wasmtime.mjs, fetched by npm run dist), signed with it.
      - name: Check each Mac app's wasmtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in release/mac*/code-learn.app; do
            wasmtime="$app/Contents/Resources/wasmtime/wasmtime"
            [ "$(lipo -archs "$app/Contents/MacOS/code-learn")" = "$(lipo -archs "$wasmtime")" ] || { echo "$app carries another chip's wasmtime."; exit 1; }
            codesign --verify --strict --verbose=2 "$wasmtime"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: code-learn-desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
